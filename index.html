<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift Card - Pue Tienda Matera</title>
  <!-- Google Fonts: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f4f6f3 0%, #e8eee5 100%);
      --card-bg: #e2ebd8;
      --card-inner: #f1f6ed;
      --text-main: #2d3b2d;
      --text-muted: #5e705e;
      --accent-color: #4a634e;
      --border-color: #ccd8c5;
      --shadow-color: rgba(45, 59, 45, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 12px;
      color: var(--text-main);
    }

    .main-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: center;
    }

    /* Escenario 3D */
    .scene {
      width: 100%;
      perspective: 1000px;
    }

    .card-container {
      width: 100%;
      min-height: 280px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    .card-container.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 18px;
      padding: 22px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 28px var(--shadow-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Cara Frontal */
    .card-face.front {
      background: linear-gradient(145deg, #e7f0e0 0%, #d8e5d0 100%);
      align-items: center;
      text-align: center;
      justify-content: center;
      gap: 16px;
    }

    .tag-title {
      font-size: 0.75rem;
      letter-spacing: 3px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 400; /* Regular sin negrita */
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .btn-flip {
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(74, 99, 78, 0.2);
    }

    .btn-flip:hover {
      background: #3c523f;
    }

    /* Cara Dorsal */
    .card-face.back {
      transform: rotateY(180deg);
      background: var(--card-bg);
    }

    .back-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .brand-sm {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-main);
    }

    .tag-sm {
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: var(--text-muted);
    }

    .details-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-inner);
      padding: 6px 10px;
      border-radius: 6px;
    }

    .detail-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .detail-value {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .message-area {
      background: var(--card-inner);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-style: italic;
      text-align: center;
      line-height: 1.3;
      margin: 4px 0;
    }

    .code-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border: 1px dashed var(--accent-color);
      padding: 6px 10px;
      border-radius: 6px;
    }

    .code-text {
      font-family: monospace;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .btn-back-flip {
      background: var(--accent-color);
      color: #ffffff;
      border: none;
      font-size: 0.7rem;
      padding: 5px 12px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 500;
    }

    .back-footer {
      font-size: 0.6rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="scene">
      <div class="card-container" id="giftCard">
        
        <!-- FRENTE -->
        <div class="card-face front">
          <span class="tag-title">GIFT CARD</span>
          <h1 class="brand-title">Pue Tienda Matera</h1>
          <button class="btn-flip" onclick="toggleFlip()">Ver detalles ➔</button>
        </div>

        <!-- DORSO -->
        <div class="card-face back">
          <div class="back-header">
            <span class="brand-sm">Pue Tienda Matera</span>
            <span class="tag-sm">GIFT CARD</span>
          </div>

          <div class="details-list">
            <div class="detail-row">
              <span class="detail-label">PARA:</span>
              <span class="detail-value" id="valPara">-</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">DE:</span>
              <span class="detail-value" id="valDe">-</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">PRODUCTO:</span>
              <span class="detail-value" id="valProducto">-</span>
            </div>
          </div>

          <div class="message-area" id="valMensaje">
            "-"
          </div>

          <div class="code-box">
            <div>
              <span class="detail-label" style="display:block; font-size:0.55rem;">CÓDIGO DE CANJE</span>
              <span class="code-text" id="valCodigo">-</span>
            </div>
            <button class="btn-back-flip" onclick="toggleFlip()">Volver</button>
          </div>

          <div class="back-footer">
            Válido por 30 días. @pue.tiendamateracolon.
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    function toggleFlip() {
      document.getElementById('giftCard').classList.toggle('is-flipped');
    }

    // Leer datos desde la URL del navegador
    function cargarDatosURL() {
      const params = new URLSearchParams(window.location.search);

      const para = params.get('para') || 'Sofi';
      const de = params.get('de') || 'Ivon';
      const producto = params.get('producto') || params.get('monto') || 'Mate Ranchero Personalizado';
      const mensaje = params.get('mensaje') || '¡Espero que disfrutes mucho de este regalo y que compartamos muchos más mates juntas!';
      const codigo = params.get('codigo') || 'GIFT-2026-PUE';

      document.getElementById('valPara').innerText = para;
      document.getElementById('valDe').innerText = de;
      document.getElementById('valProducto').innerText = producto;
      document.getElementById('valMensaje').innerText = '"' + mensaje + '"';
      document.getElementById('valCodigo').innerText = codigo;
    }

    window.onload = cargarDatosURL;
  </script>

</body>
</html>
